name: Kicktipp Bundesliga Tipps

on:
  schedule:
    - cron: "0 18 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tipps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt
      - name: Tipps berechnen und verschicken
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMPFAENGER_EMAIL: ${{ secrets.EMPFAENGER_EMAIL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py
      - name: Log-Datei und Homescreen-Seite committen
        run: |
          git config user.name "Kicktipp Bot"
          git config user.email "bot@users.noreply.github.com"
          git add tipps/ docs/
          git commit -m "Tipps vom $(date +%Y-%m-%d)" || echo "Nichts Neues zu committen"
          git push
